if loadfont "${prefix}/fonts/unicode.pf2" ; then
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

set default=0
set timeout=5

menuentry "OmidenOs Live" --class omidenos --class gnu-linux --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label 'OMIDEN_LIVE'
    linux  /@/arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=OMIDEN_LIVE quiet splash loglevel=3
    initrd /@/arch/boot/x86_64/initramfs-linux.img
}

menuentry "OmidenOs Live (safe mode)" --class omidenos --class gnu-linux --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label 'OMIDEN_LIVE'
    linux  /@/arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=OMIDEN_LIVE nomodeset
    initrd /@/arch/boot/x86_64/initramfs-linux.img
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry "Reboot" --class restart { reboot }
    menuentry "Shutdown" --class shutdown { halt }
fi
