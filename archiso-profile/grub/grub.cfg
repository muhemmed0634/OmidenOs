# OmidenOS GRUB Configuration
# GitHub: https://github.com/muhemmed0634/OmidenOS

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

set default=0
set timeout=5

# Load OmidenOS logo if available
if background_image /boot/grub/splash.png; then
    set color_normal=white/black
    set color_highlight=magenta/black
else
    set color_normal=light-gray/black
    set color_highlight=magenta/black
fi

menuentry "OmidenOS Live" --class omidenos --class gnu-linux --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --file /arch/boot/x86_64/vmlinuz-linux
    linux  /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "OmidenOS Live (safe mode)" --class omidenos --class gnu-linux --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --file /arch/boot/x86_64/vmlinuz-linux
    linux  /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisosearchuuid=%ARCHISO_UUID% nomodeset
    initrd /arch/boot/x86_64/initramfs-linux.img
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry "Reboot" --class restart { reboot }
    menuentry "Shutdown" --class shutdown { halt }
fi
