LABEL omidenos
TEXT HELP
Boot the Omiden OS Live/Install medium on BIOS.
It allows you to install Omiden OS or perform system maintenance.
ENDTEXT
MENU LABEL Omiden OS Live/Install (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL omidenos-speech
TEXT HELP
Boot the Omiden OS Live/Install medium on BIOS with speakup screen reader.
It allows you to install Omiden OS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Omiden OS with ^speech (accessibility)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%

