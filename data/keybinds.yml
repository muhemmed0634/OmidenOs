# Omiden OS Keybindings
# Single source of truth for all shortcuts
# Format: action, hyprland_bind, i3_bind, description_en, description_az

# === BASIC ACTIONS ===
- action: terminal
  hyprland_bind: "SUPER, Return, exec, kitty"
  i3_bind: "bindsym $mod+Return exec kitty"
  description_en: "Open terminal"
  description_az: "Terminal aç"

- action: launcher
  hyprland_bind: "SUPER, D, exec, rofi -show drun"
  i3_bind: "bindsym $mod+d exec rofi -show drun"
  description_en: "Application launcher"
  description_az: "Tətbiq başladıcı"

- action: close_window
  hyprland_bind: "SUPER, Q, killactive"
  i3_bind: "bindsym $mod+Shift+q kill"
  description_en: "Close focused window"
  description_az: "Fokuslanmış pəncərəni bağla"

- action: reload_config
  hyprland_bind: "SUPER_SHIFT, R, exec, hyprctl reload"
  i3_bind: "bindsym $mod+Shift+r reload"
  description_en: "Reload configuration"
  description_az: "Konfiqurasiyanı yenilə"

- action: exit_wm
  hyprland_bind: "SUPER_SHIFT, E, exec, rofi -show power-menu"
  i3_bind: "bindsym $mod+Shift+e exec rofi -show power-menu"
  description_en: "Power menu"
  description_az: "Güc menyusu"

# === WINDOW MANAGEMENT ===
- action: focus_left
  hyprland_bind: "SUPER, H, movefocus, l"
  i3_bind: "bindsym $mod+h focus left"
  description_en: "Focus left"
  description_az: "Sola fokuslan"

- action: focus_down
  hyprland_bind: "SUPER, J, movefocus, d"
  i3_bind: "bindsym $mod+j focus down"
  description_en: "Focus down"
  description_az: "Aşağı fokuslan"

- action: focus_up
  hyprland_bind: "SUPER, K, movefocus, u"
  i3_bind: "bindsym $mod+k focus up"
  description_en: "Focus up"
  description_az: "Yuxarı fokuslan"

- action: focus_right
  hyprland_bind: "SUPER, L, movefocus, r"
  i3_bind: "bindsym $mod+l focus right"
  description_en: "Focus right"
  description_az: "Sağa fokuslan"

- action: move_left
  hyprland_bind: "SUPER_SHIFT, H, movewindow, l"
  i3_bind: "bindsym $mod+Shift+h move left"
  description_en: "Move window left"
  description_az: "Pəncərəni sola daşı"

- action: move_down
  hyprland_bind: "SUPER_SHIFT, J, movewindow, d"
  i3_bind: "bindsym $mod+Shift+j move down"
  description_en: "Move window down"
  description_az: "Pəncərəni aşağı daşı"

- action: move_up
  hyprland_bind: "SUPER_SHIFT, K, movewindow, u"
  i3_bind: "bindsym $mod+Shift+k move up"
  description_en: "Move window up"
  description_az: "Pəncərəni yuxarı daşı"

- action: move_right
  hyprland_bind: "SUPER_SHIFT, L, movewindow, r"
  i3_bind: "bindsym $mod+Shift+l move right"
  description_en: "Move window right"
  description_az: "Pəncərəni sağa daşı"

- action: toggle_fullscreen
  hyprland_bind: "SUPER, F, fullscreen"
  i3_bind: "bindsym $mod+f fullscreen toggle"
  description_en: "Toggle fullscreen"
  description_az: "Tam ekran keçid"

- action: toggle_float
