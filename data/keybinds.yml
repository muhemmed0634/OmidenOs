  description_en: "Split horizontal"
  description_az: "Üfüqi böl"

- action: split_vertical
  hyprland_bind: ""
  i3_bind: "bindsym $mod+v split v"
  description_en: "Split vertical"
  description_az: "Şaquli böl"

