# === SYSTEM FUNCTIONS ===
- action: lock_screen
  hyprland_bind: "SUPER, L, exec, hyprlock"
  i3_bind: "bindsym $mod+Shift+x exec i3lock -c 000000"
  description_en: "Lock screen"
  description_az: "Ekranı kilitle"

- action: wallpaper_picker
  hyprland_bind: "SUPER, W, exec, omiden-wallpaper-picker"
  i3_bind: "bindsym $mod+w exec omiden-wallpaper-picker"
  description_en: "Wallpaper picker"
  description_az: "Wallpaper seçici"

- action: theme_toggle
  hyprland_bind: "SUPER_SHIFT, T, exec, omiden-theme-toggle"
  i3_bind: "bindsym $mod+Shift+t exec omiden-theme-toggle"
  description_en: "Toggle dark/light theme"
  description_az: "Qaranlıq/açıq tema dəyiş"

- action: screenshot_full
  hyprland_bind: ", Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"
  i3_bind: "bindsym Print exec maim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"
  description_en: "Screenshot (full)"
  description_az: "Ekran görüntüsü (tam)"

- action: screenshot_area
  hyprland_bind: "SHIFT, Print, exec, grim -g \"$(slurp)\" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"
  i3_bind: "bindsym Shift+Print exec maim -s ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"
  description_en: "Screenshot (area)"
  description_az: "Ekran görüntüsü (sahə)"

- action: screenshot_edit
  hyprland_bind: "CONTROL, Print, exec, grim -g \"$(slurp)\" - | swappy -f -"
  i3_bind: "bindsym Control+Print exec maim -s | swappy -f -"
  description_en: "Screenshot (edit)"
  description_az: "Ekran görüntüsü (redaktə)"

# === MEDIA CONTROLS ===
- action: volume_up
  hyprland_bind: ", XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
  i3_bind: "bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
  description_en: "Volume up"
  description_az: "Səsi artır"

- action: volume_down
  hyprland_bind: ", XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
  i3_bind: "bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
  description_en: "Volume down"
  description_az: "Səsi azalt"

- action: volume_mute
  hyprland_bind: ", XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
  i3_bind: "bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
  description_en: "Mute toggle"
  description_az: "Səssiz keçid"

- action: media_play_pause
  hyprland_bind: ", XF86AudioPlay, exec, playerctl play-pause"
  i3_bind: "bindsym XF86AudioPlay exec playerctl play-pause"
  description_en: "Play/pause"
  description_az: "Oynat/dayandır"

- action: media_next
  hyprland_bind: ", XF86AudioNext, exec, playerctl next"
  i3_bind: "bindsym XF86AudioNext exec playerctl next"
  description_en: "Next track"
  description_az: "Növbəti trek"

- action: media_prev
  hyprland_bind: ", XF86AudioPrev, exec, playerctl previous"
  i3_bind: "bindsym XF86AudioPrev exec playerctl previous"
  description_en: "Previous track"
  description_az: "Əvvəlki trek"

# === BRIGHTNESS ===
- action: brightness_up
  hyprland_bind: ", XF86MonBrightnessUp, exec, brightnessctl set +5%"
  i3_bind: "bindsym XF86MonBrightnessUp exec brightnessctl set +5%"
  description_en: "Brightness up"
  description_az: "Parlaqlıq artır"

- action: brightness_down
  hyprland_bind: ", XF86MonBrightnessDown, exec, brightnessctl set 5%-"
  i3_bind: "bindsym XF86MonBrightnessDown exec brightnessctl set 5%-"
  description_en: "Brightness down"
  description_az: "Parlaqlıq azalt"

# === FILE MANAGER ===
- action: file_manager
  hyprland_bind: "SUPER, E, exec, thunar"
  i3_bind: "bindsym $mod+e exec thunar"
  description_en: "Open file manager"
  description_az: "Fayl meneceri aç"

- action: terminal_file_manager
  hyprland_bind: "SUPER_SHIFT, E, exec, kitty yazi"
  i3_bind: "bindsym $mod+Shift+f exec kitty yazi"
  description_en: "Terminal file manager"
  description_az: "Terminal fayl meneceri"

# === BROWSERS & APPS ===
- action: browser
  hyprland_bind: "SUPER, B, exec, firefox"
  i3_bind: "bindsym $mod+b exec firefox"
  description_en: "Open browser"
  description_az: "Brauzer aç"

