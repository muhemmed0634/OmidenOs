#
# Live medium only. SDDM is the single display manager (ADR-0006) and it
# owns tty1; the console autologin moved to tty2 so there is always a
# text fallback when a session fails to start.
#
# Autologin is the live-session behaviour: no password exists on the
# medium, the installed system sets its own user through the installer
# and does not carry this file. XFCE is the only session in v1.0
# (ADR-0010), so there is nothing to choose on the login screen.

[Autologin]
User=omiden
Session=xfce.desktop
Relogin=false

[General]
Numlock=on
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
