#
# Greeter theme selection. Separate from live-autologin.conf because that
# file is live-medium behaviour (no password exists on the medium) while
# this one belongs to the image: the installed system inherits the theme
# and chooses its own autologin.
#
# SDDM reads every *.conf in this directory; this file sorts before
# live-autologin.conf and touches no key that file owns.

[Theme]
Current=omidenos
