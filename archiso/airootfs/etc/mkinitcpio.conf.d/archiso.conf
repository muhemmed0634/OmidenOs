#
# Initramfs for the live medium. The hook list is the upstream one plus
# `plymouth` for the boot splash; the rest stays as it is until
# omidenos-initcpio replaces the stock hooks (ADR-0003).
#
# `plymouth` sits directly after `udev`: there it can open the DRM device
# before the block and filesystem hooks start writing to the console. The
# theme ships in the airootfs overlay, but the kernel package built an
# initramfs during package installation, before the overlay theme existed,
# so customize_airootfs.sh rebuilds the initramfs once the theme and
# /etc/plymouth/plymouthd.conf are in place.
#
# Compression: zstd instead of xz. The kernel decompresses this archive
# on every boot, and zstd decompresses several times faster than xz at
# -9e for a slightly larger archive. The measured numbers per build are
# recorded in docs/dev/building.md.

HOOKS=(base udev plymouth modconf archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-15)
