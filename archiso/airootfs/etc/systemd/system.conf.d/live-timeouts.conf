#
# Live medium only. Timeouts are short because nothing on the medium has
# durable state: a unit that hangs costs the user a shutdown, not data.
# The installed system keeps the stock timeouts.

[Manager]
DefaultTimeoutStartSec=20s
DefaultTimeoutStopSec=5s
DefaultTimeoutAbortSec=5s
