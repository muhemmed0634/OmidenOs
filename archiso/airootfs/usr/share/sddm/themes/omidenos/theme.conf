#
# SDDM greeter theme (ADR-0006 display manager, ADR-0010 single session,
# ADR-0012 palette). SDDM reads [`General`] and the greeter exposes every
# key of this file to Main.qml as `config.<key>`; the QML holds the same
# values as fallbacks, so a missing key cannot leave an invisible widget.
#
# The live medium autologins (etc/sddm.conf.d/live-autologin.conf) and
# never paints this screen. It is what a logout shows, and what the
# installed system shows before the installer has written its own user.

[General]
description=OmidenOS greeter
name=OmidenOS
author=OmidenOS project

# Artwork. The greeter frame is the wallpaper's crest left of centre with
# the right third left dark for the card; it is generated from
# wallpaper.png by tools that live outside the image, so replacing it with a
# new owner-provided backdrop needs no QML change.
backdrop=/usr/share/backgrounds/omidenos/greeter.png
logo=/usr/share/icons/hicolor/256x256/apps/omidenos-logo.png

# Palette, mirrored from branding/palette.toml (ADR-0012).
ink=#06020F
surface=#120A2B
surface_raised=#1B123E
line=#2C1F55
foreground=#EDE9FE
muted=#9C90C4
accent=#8B5CF6
accent_bright=#A78BFA
danger=#FF8A8A

[branding]
title=OmidenOS
