#
# quiet and splash hand the console to the Plymouth boot splash, which is
# the only thing that should own the screen on the normal paths; the safe
# graphics and forensic entries stay verbose on purpose, because those are
# the entries a user picks when something is wrong or when device
# detection matters.

title   OmidenOS Live
sort-key 01
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 %KERNEL_PARAMS%
