#
# nomodeset disables kernel mode-setting for hardware that renders
# badly with the default graphics stack.

title   OmidenOS Live (safe graphics)
sort-key 03
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
