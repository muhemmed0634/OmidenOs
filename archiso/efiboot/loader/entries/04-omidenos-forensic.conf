#
# Forensic mode. With the Phase 3 omidenos-initcpio hooks the
# `omidenosforensic` parameter makes the live system:
#   - mount every block device read-only and not auto-mount anything,
#   - disable swap and zram.
# With the interim Phase 2 stock hooks this parameter is not yet acted
# on; the entry exists so the boot menu is final from Phase 2 onward
# and the activation is completed in Phase 3 (tracked in
# docs/BACKLOG.md).

title   OmidenOS Live (forensic mode)
sort-key 04
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% omidenosforensic %KERNEL_PARAMS%
