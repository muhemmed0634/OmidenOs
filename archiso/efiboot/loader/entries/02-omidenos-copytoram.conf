#
# copytoram: the squashfs image is copied to RAM before being mounted;
# the USB medium can be detached afterwards. RAM usage grows by the
# image size (documented in docs/uefi.md in Phase 2/7).

title   OmidenOS Live (copy to RAM)
sort-key 02
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram %KERNEL_PARAMS%
