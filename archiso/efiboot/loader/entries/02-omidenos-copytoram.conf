#
# Copytoram: the squashfs image is copied to RAM before being mounted, so
# the medium can be detached afterwards and every read comes from memory.
# RAM use grows by the image size. Quiet like the default entry; the
# verbose boot paths are safe graphics and forensic mode.

title   OmidenOS Live (copy to RAM)
sort-key 02
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram quiet loglevel=3 %KERNEL_PARAMS%
