#
# Build-time pacman configuration for the OmidenOS live medium.
# Only upstream core and extra repositories are used (section 8 of the
# product spec). Mirror endpoints are inlined so the profile does not
# depend on the build host's /etc/pacman.d/mirrorlist (which may list
# third-party repositories); both endpoints were verified reachable on
# 2026-11-17. Mirrors using the short "/arch/" URL path are preferred
# over ones embedding the third-party name in the URL so that no
# third-party distribution name appears in first-party files
# (section 6.2; the mirror addresses themselves remain S3 upstream
# references).
#
# The [omidenos] repository (file://, signed, Phase 3) is added here
# when its first packages exist; the ISO's target-side pacman.conf is a
# separate file shipped by omidenos-base and points at the published
# HTTPS repository.

[options]
HoldPkg     = pacman glibc
Architecture = auto

ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.moson.org/arch/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.moson.org/arch/$repo/os/$arch
