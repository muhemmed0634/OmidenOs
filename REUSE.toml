#
# REUSE annotations for files that cannot carry inline comments
# (account databases, hostname, README, dotfiles) and for binary
# brand assets. See docs/adr/0009-licensing.md.

version = 1

# Project files without inline SPDX headers.
[[annotations]]
path = [
    ".gitignore",
    "README.md",
    "archiso/airootfs/etc/hostname",
    "archiso/airootfs/etc/issue",
    "archiso/airootfs/etc/locale.conf",
    "archiso/airootfs/etc/motd",
    "archiso/airootfs/etc/group",
    "archiso/airootfs/etc/passwd",
    "archiso/airootfs/etc/shadow",
    "archiso/airootfs/etc/mkinitcpio.conf.d/archiso.conf",
]
precedence = "override"
SPDX-FileCopyrightText = "OmidenOS project"
SPDX-License-Identifier = "BSD-3-Clause"

# Brand assets supplied by the owner.
[[annotations]]
path = [
    "Omiden.png",
    "OmidenOS.png",
    "branding/source/logo.png",
    "archiso/airootfs/usr/share/backgrounds/omidenos/wallpaper.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 muhemmed0634"
SPDX-License-Identifier = "CC-BY-SA-4.0"
