#
# Forbidden third-party distribution terms for brand-scan.
# Words that merely contain "arch" as a substring (search, research,
# architecture, hierarchy, ARCH as an architecture variable, and similar)
# are deliberately NOT forbidden; tests/test_forbidden_terms.py locks
# this behavior with positive and negative fixtures.

# strict mode scope: first-party product sources only.
# Development-only trees (docs/dev/, .github/) are build-environment
# surfaces and are scanned by the image/runtime modes in later phases.

[[forbidden]]
id = "archlinux"
pattern = "archlinux"

[[forbidden]]
id = "arch-linux"
pattern = "arch[ -_]?linux"

[[forbidden]]
id = "archiso"
pattern = "archiso"

[[forbidden]]
id = "archinstall"
pattern = "archinstall"

[[forbidden]]
id = "arch-chroot"
pattern = "arch-chroot"

[[forbidden]]
id = "blackarch"
pattern = "blackarch"

[[forbidden]]
id = "aur"
pattern = "\\bAUR\\b"

[[forbidden]]
id = "kernel-suffix"
# version suffix emitted by the stock kernel packaging, e.g. -arch1
pattern = "-arch[0-9]"

[[forbidden]]
id = "archiso-cmdline"
# stock live-media kernel parameters: archisobasedir, archisosearchuuid,
# archisolabel, archisodevice, archiso_http_srv
pattern = "archiso[a-z_]*"
