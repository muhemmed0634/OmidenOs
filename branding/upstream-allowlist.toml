#
# Allowlist for brand-scan. Every row must carry a justification; rows
# without a reason are rejected in review. Rows are expected to shrink;
# each row with planned_removal must disappear in the named phase or the
# scan fails.

[[allowlist]]
term = "archlinux"
path = "archiso/pacman.conf"
reason = "S3 upstream mirror endpoint: the fastest verified sync mirror (mirror.osbeck.com, 2 MB/s vs 0.2 MB/s for the next one on 2026-11-17) serves the repository tree under an /archlinux/ URL path. Mirror URLs are third-party upstream references (S3), not product branding; the secondary endpoint (geo.mirror.pkgbuild.com) carries no such string."

[[allowlist]]
term = "arch-linux"
path = "archiso/pacman.conf"
reason = "Same S3 upstream mirror endpoint as the archlinux row; the arch[ -_]?linux pattern also matches the /archlinux/ URL path."

[[allowlist]]
term = "archiso"
path = "archiso/.*"
reason = "Interim Phase 2 profile: the live media still uses the stock mkinitcpio-archiso hooks, which only recognize the stock kernel command line parameters. The omidenos-initcpio fork (ADR-0003) renames both hooks and parameters."
planned_removal = "Phase 3"

[[allowlist]]
term = "archiso-cmdline"
path = "archiso/.*"
reason = "Interim Phase 2 boot entries pass the stock hook parameters (archisobasedir, archisosearchuuid) required by the stock hooks. Replaced by omidenos* parameters in the Phase 3 fork."
planned_removal = "Phase 3"
