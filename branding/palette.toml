#
# Project palette, derived from the crest in `branding/source/logo.png`.
# The derivation and the per-surface mapping are recorded in
# `docs/adr/0012-palette.md`. Every user-visible surface takes its colours
# from this file; nothing is picked per file.

[meta]
source = "branding/source/logo.png"
accent_origin = "crest purples, sampled in the #7860d0..#a088e8 range"
decision = "docs/adr/0012-palette.md"

[palette]
# Background of the greeter and the panel. The boot splash stays black:
# splash.png fades to black at its own edges, so any other value would
# draw a border around the artwork.
ink = "#06020F"
# Panels and cards that sit on `ink`.
surface = "#120A2B"
surface_raised = "#1B123E"
line = "#2C1F55"
foreground = "#EDE9FE"
muted = "#9C90C4"
# The single accent. It matches the Plymouth progress dot already in the
# tree, so boot and greeter share one violet.
accent = "#8B5CF6"
accent_bright = "#A78BFA"
accent_deep = "#4C1D95"
danger = "#FF8A8A"

[usage]
boot_splash_dot = "accent"
greeter_backdrop = "ink (scrim behind the card)"
greeter_card = "surface"
greeter_card_border = "accent"
greeter_heading = "foreground"
greeter_field = "surface_raised"
greeter_field_border = "line"
greeter_placeholder = "muted"
greeter_button = "accent"
greeter_button_hover = "accent_bright"
greeter_error = "danger"
panel_background = "ink at 94% opacity"
panel_foreground = "foreground"
